openapi: 3.1.0
info:
  title: Envelope Sync Relay API
  version: 1.0.0
  description: |
    Zero-knowledge document sync relay for offline-first applications.
    Full specification: docs/envelope-sync-relay/README.md

    WebSocket notifications (v1.1): wss://{host}/v1/namespaces/{namespaceId}/notifications
    See 13-WEBSOCKET-NOTIFICATIONS.md — not covered by this OpenAPI file.

servers:
  - url: https://sync.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Namespaces
  - name: Devices
  - name: Documents
  - name: Limits
  - name: Recovery
  - name: Admin
  - name: Health

components:
  securitySchemes:
    DeviceToken:
      type: http
      scheme: bearer
      bearerFormat: device_token
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: admin_api_token

  parameters:
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,62}$'

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    Limits:
      type: object
      properties:
        freeDeviceLimit:
          type: integer
        purchasedSlots:
          type: integer
        maxDevices:
          type: integer
        activeDevices:
          type: integer

    OnLimitReached:
      type: object
      properties:
        mode:
          type: string
          enum: [payment, block]
        slotPackages:
          type: array
          items:
            type: integer

    EsrDocEnvelope:
      type: object
      required:
        - magic
        - schemaVersion
        - namespaceId
        - namespaceLabel
        - documentId
        - revision
        - deviceId
        - writtenAt
        - contentType
        - contentMagic
        - contentSha256
        - payload
      properties:
        magic:
          type: string
          const: ESR-DOC1
        schemaVersion:
          type: integer
          enum: [1, 2]
        namespaceId:
          type: string
          format: uuid
        namespaceLabel:
          type: string
        documentId:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,62}$'
          description: schemaVersion 1 requires `primary`; schemaVersion 2 allows any valid id
        revision:
          type: string
        deviceId:
          type: string
        writtenAt:
          type: string
          format: date-time
        contentType:
          type: string
        contentMagic:
          type: string
          enum: [ENV-RAW1, ENV-ENC1]
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        payload:
          type: string

    DocumentHeadMeta:
      type: object
      properties:
        revision:
          type: string
        writtenAt:
          type: string
          format: date-time
        deviceId:
          type: string
        contentSha256:
          type: string
        contentMagic:
          type: string
        sizeBytes:
          type: integer

    Device:
      type: object
      properties:
        deviceId:
          type: string
        clientDeviceId:
          type: string
        label:
          type: string
        pairedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean

    RateLimitQuota:
      type: object
      required: [action, limit, remaining, resetAfterSeconds, windowSeconds]
      properties:
        action:
          type: string
          enum: [global_ip, put_document, recover, pair_device, pairing_token]
          description: Internal action id; JSON `rateLimits` keys match this value (document PUT uses `put_document`).
        limit:
          type: integer
        remaining:
          type: integer
        resetAfterSeconds:
          type: integer
          description: Seconds until the oldest event in the sliding window expires.
        windowSeconds:
          type: integer

    RateLimits:
      type: object
      description: Optional on success when limits.rateLimit.enabled; keys are action ids.
      additionalProperties:
        $ref: '#/components/schemas/RateLimitQuota'

    PushDocumentResult:
      type: object
      required: [revision, writtenAt, contentSha256, writerDeviceId]
      properties:
        revision:
          type: string
        writtenAt:
          type: string
          format: date-time
        contentSha256:
          type: string
        writerDeviceId:
          type: string
        rateLimits:
          $ref: '#/components/schemas/RateLimits'

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error429:
      description: |
        Rate limit exceeded (`RATE_LIMIT_EXCEEDED`). No top-level `rateLimits` on errors —
        use `error.details.rateLimit` (single quota). Matching `RateLimit-*` or prefixed
        headers (e.g. `RateLimit-PutDocument-*` for `put_document`).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorBody'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          retryAfterSeconds:
                            type: integer
                          action:
                            type: string
                            enum: [global_ip, put_document, recover, pair_device, pairing_token]
                          rateLimit:
                            $ref: '#/components/schemas/RateLimitQuota'

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  version:
                    type: string
                  db:
                    type: string
                  blob:
                    type: string

  /namespaces:
    post:
      tags: [Namespaces]
      summary: Create namespace (first device / host)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - namespaceId
                - namespaceLabel
                - recoveryKeySalt
                - recoveryKeyHash
                - deviceLabel
                - clientDeviceId
              properties:
                namespaceId:
                  type: string
                  format: uuid
                namespaceLabel:
                  type: string
                recoveryKeySalt:
                  type: string
                recoveryKeyHash:
                  type: string
                deviceLabel:
                  type: string
                clientDeviceId:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaceId:
                    type: string
                  deviceToken:
                    type: string
                  deviceId:
                    type: string
                  limits:
                    $ref: '#/components/schemas/Limits'
        '409':
          $ref: '#/components/responses/Error409'

  /namespaces/{namespaceId}:
    get:
      tags: [Namespaces]
      summary: Get namespace info
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /namespaces/{namespaceId}/devices:
    get:
      tags: [Devices]
      summary: List devices
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  limits:
                    $ref: '#/components/schemas/Limits'
    post:
      tags: [Devices]
      summary: Redeem pairing code (new device)
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode, deviceLabel, clientDeviceId]
              properties:
                pairingCode:
                  type: string
                deviceLabel:
                  type: string
                clientDeviceId:
                  type: string
      responses:
        '201':
          description: Paired (may include `rateLimits` with `global_ip` and `pair_device`)
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: Revoke device
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Error403'

  /namespaces/{namespaceId}/pairing-tokens:
    post:
      tags: [Devices]
      summary: Create pairing token
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
      responses:
        '201':
          description: Token created (may include `rateLimits` with `global_ip` and `pairing_token`)
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/recover:
    post:
      tags: [Recovery]
      summary: Recover namespace access
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryKeyProof, deviceLabel, clientDeviceId]
              properties:
                recoveryKeyProof:
                  type: object
                  properties:
                    salt:
                      type: string
                    hash:
                      type: string
                deviceLabel:
                  type: string
                clientDeviceId:
                  type: string
      responses:
        '200':
          description: Recovered (may include `rateLimits` in body)
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents:
    get:
      tags: [Documents]
      summary: List document heads in namespace
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/DocumentHeadMeta'
                        - type: object
                          required: [documentId]
                          properties:
                            documentId:
                              type: string
                  rateLimits:
                    $ref: '#/components/schemas/RateLimits'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/{documentId}/head/meta:
    get:
      tags: [Documents]
      summary: Get head metadata for a document
      security:
        - DeviceToken: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DocumentHeadMeta'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '400':
          description: Invalid documentId
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/{documentId}/head:
    get:
      tags: [Documents]
      summary: Get full head envelope for a document
      security:
        - DeviceToken: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EsrDocEnvelope'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '400':
          description: Invalid documentId
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/{documentId}:
    put:
      tags: [Documents]
      summary: Push new revision for a document
      security:
        - DeviceToken: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                expectedRevision:
                  type: string
                  nullable: true
                envelope:
                  $ref: '#/components/schemas/EsrDocEnvelope'
      responses:
        '201':
          description: Pushed (includes `rateLimits` with `global_ip` and `put_document` when enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDocumentResult'
        '403':
          description: Document limit or id not allowed
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          description: Invalid envelope or documentId mismatch
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/primary/head/meta:
    get:
      tags: [Documents]
      summary: Get head metadata only
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DocumentHeadMeta'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/primary/head:
    get:
      tags: [Documents]
      summary: Get full head envelope
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EsrDocEnvelope'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/primary:
    put:
      tags: [Documents]
      summary: Push new document revision
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                expectedRevision:
                  type: string
                  nullable: true
                envelope:
                  $ref: '#/components/schemas/EsrDocEnvelope'
      responses:
        '201':
          description: Pushed (includes `rateLimits` with `global_ip` and `put_document` when enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDocumentResult'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          description: Invalid envelope
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/limits:
    get:
      tags: [Limits]
      summary: Get slot limits
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Limits'
                  - type: object
                    properties:
                      onLimitReached:
                        $ref: '#/components/schemas/OnLimitReached'
                      canAddDevice:
                        type: boolean

  /namespaces/{namespaceId}/unlock:
    post:
      tags: [Limits]
      summary: Redeem unlock code
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unlockCode]
              properties:
                unlockCode:
                  type: string
      responses:
        '200':
          description: Unlocked
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'

  /admin/overview:
    get:
      tags: [Admin]
      summary: Relay overview stats
      security:
        - AdminToken: []
      responses:
        '200':
          description: Overview counts

  /admin/namespaces:
    get:
      tags: [Admin]
      summary: List namespaces
      security:
        - AdminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated namespaces

  /admin/unlock-events:
    get:
      tags: [Admin]
      summary: List unlock events
      security:
        - AdminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated unlock events

  /admin/rate-limit-events:
    get:
      tags: [Admin]
      summary: List rate limit events
      security:
        - AdminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated rate limit events

  /admin/unlock-codes:
    get:
      tags: [Admin]
      summary: List unlock codes
      security:
        - AdminToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated unlock codes
    post:
      tags: [Admin]
      summary: Generate unlock code
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [namespaceId, slots]
              properties:
                namespaceId:
                  type: string
                  format: uuid
                slots:
                  type: integer
                expiresAt:
                  type: string
                  format: date-time
                note:
                  type: string
      responses:
        '201':
          description: Code generated
