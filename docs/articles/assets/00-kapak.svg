<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0c2f2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)"/>
  <ellipse cx="900" cy="320" rx="360" ry="300" fill="url(#glow)"/>

  <!-- brand -->
  <g transform="translate(80,78)">
    <circle cx="10" cy="0" r="9" fill="url(#accent)"/>
    <text x="32" y="6" font-size="22" font-weight="700" fill="#e2e8f0" letter-spacing="1">senkronla</text>
  </g>
  <text x="80" y="120" font-size="14" font-weight="600" fill="#5eead4" letter-spacing="3">ENVELOPE SYNC RELAY</text>

  <!-- headline -->
  <text x="80" y="248" font-size="58" font-weight="800" fill="#f8fafc">Gizlili&#287;i bozmadan,</text>
  <text x="80" y="320" font-size="58" font-weight="800" fill="url(#accent)">cihazlar aras&#305; senkron</text>

  <text x="82" y="378" font-size="22" fill="#94a3b8">Veri kullan&#305;c&#305;n&#305;n cihaz&#305;nda &#351;ifrelenir.</text>
  <text x="82" y="410" font-size="22" fill="#94a3b8">Relay yaln&#305;zca kapal&#305; zarf&#305; ta&#351;&#305;r, i&#231;ine bakmaz.</text>

  <!-- footer chips -->
  <g transform="translate(82,470)">
    <rect x="0" y="0" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="75" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#5eead4">senkron.la</text>
    <rect x="166" y="0" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="256" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#a5b4fc">&#246;rnek: kurtar.co</text>
    <rect x="362" y="0" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#cbd5e1" stroke-opacity="0.35"/>
    <text x="447" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#cbd5e1">a&#231;&#305;k kaynak &#183; MIT</text>
  </g>

  <!-- illustration: envelope + connected devices -->
  <g transform="translate(900,300)">
    <!-- connection lines -->
    <line x1="0" y1="0" x2="-170" y2="-150" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="3 7"/>
    <line x1="0" y1="0" x2="185" y2="-110" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="3 7"/>
    <line x1="0" y1="0" x2="170" y2="150" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="3 7"/>
    <line x1="0" y1="0" x2="-180" y2="120" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="3 7"/>

    <!-- device nodes -->
    <g fill="#0f172a" stroke="#5eead4" stroke-width="2">
      <rect x="-202" y="-178" width="64" height="46" rx="7"/>
      <rect x="155" y="-138" width="48" height="64" rx="9"/>
      <rect x="142" y="118" width="64" height="46" rx="7"/>
      <rect x="-210" y="98" width="48" height="64" rx="9"/>
    </g>

    <!-- central envelope -->
    <g transform="translate(-95,-72)">
      <rect x="0" y="0" width="190" height="132" rx="16" fill="url(#env)"/>
      <path d="M0 12 L95 80 L190 12" fill="none" stroke="#0f172a" stroke-width="4" stroke-opacity="0.55"/>
      <circle cx="95" cy="96" r="26" fill="#0f172a"/>
      <rect x="84" y="90" width="22" height="20" rx="4" fill="#5eead4"/>
      <path d="M87 90 a8 8 0 0 1 16 0" fill="none" stroke="#5eead4" stroke-width="4"/>
      <text x="95" y="-14" text-anchor="middle" font-size="15" font-weight="700" fill="#5eead4">ESR-DOC1</text>
    </g>
  </g>
</svg>
