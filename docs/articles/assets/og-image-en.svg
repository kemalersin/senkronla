    <text x="80" y="172" font-size="15" font-weight="600" letter-spacing="3" fill="#0b7a71">ENVELOPE SYNC RELAY</text>

    <text x="78" y="258" font-size="52" font-weight="700" fill="#1b2330" font-family="'Source Serif 4', Georgia, serif">Without compromising</text>
    <text x="78" y="318" font-size="52" font-weight="700" fill="#1b2330" font-family="'Source Serif 4', Georgia, serif">privacy,</text>
    <text x="78" y="378" font-size="52" font-weight="700" fill="#0b7a71" font-family="'Source Serif 4', Georgia, serif">sync across devices</text>

    <text x="80" y="432" font-size="22" fill="#5a6578">Data is encrypted on the user&apos;s device.</text>
    <text x="80" y="462" font-size="22" fill="#5a6578">The relay only carries sealed envelopes; it never looks inside.</text>

