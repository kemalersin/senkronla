<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" rx="16" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Sync flow: ask first, then pull; on conflict, leave it to the user</text>

  <rect x="120" y="70" width="170" height="40" rx="10" fill="#4338ca"/>
  <text x="205" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Client</text>
  <line x1="205" y1="110" x2="205" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="670" y="70" width="170" height="40" rx="10" fill="#0f766e"/>
  <text x="755" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Senkronla relay</text>
  <line x1="755" y1="110" x2="755" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="210" y="150" font-size="13" font-weight="600" fill="#0f172a">1. &quot;What&apos;s the latest revision?&quot;</text>
  <path d="M205 158 L750 158" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="478" y="174" text-anchor="middle" font-size="12" fill="#6366f1">GET head/meta</text>

  <text x="210" y="200" font-size="12.5" font-weight="600" fill="#0f172a">2. If changed, download envelope,</text>
  <text x="210" y="216" font-size="12.5" font-weight="600" fill="#0f172a">decrypt locally</text>
  <path d="M205 224 L750 224" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="478" y="240" text-anchor="middle" font-size="12" fill="#6366f1">GET head</text>

  <text x="210" y="272" font-size="12.5" font-weight="600" fill="#0f172a">3. Upload local change (expectedRevision)</text>
  <path d="M205 280 L750 280" stroke="#14b8a6" stroke-width="2.5" marker-end="url(#a2t)"/>
  <text x="478" y="296" text-anchor="middle" font-size="12" fill="#0f766e">PUT document</text>

  <rect x="300" y="322" width="360" height="76" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="480" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#be123c">4. If someone else got there first: 409 Conflict</text>
  <text x="480" y="372" text-anchor="middle" font-size="12.5" fill="#9f1239">Server does not merge. The app (i.e. the user) decides.</text>
  <path d="M755 310 L660 340" stroke="#fb7185" stroke-width="2.5" marker-end="url(#a2r)"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6366f1"/></marker>
    <marker id="a2t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#14b8a6"/></marker>
    <marker id="a2r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/></marker>
  </defs>
</svg>
