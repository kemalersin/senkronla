<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="390" rx="16" fill="#0f172a"/>
  <text x="480" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#f8fafc">You don&apos;t have to pick one</text>

  <circle cx="408" cy="200" r="118" fill="#14b8a6" fill-opacity="0.18" stroke="#5eead4" stroke-width="2.5"/>
  <text x="362" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#5eead4">Privacy</text>
  <text x="362" y="210" text-anchor="middle" font-size="13" fill="#99f6e4">data stays on device</text>
  <text x="362" y="231" text-anchor="middle" font-size="13" fill="#99f6e4">encrypted end to end</text>

  <circle cx="552" cy="200" r="118" fill="#6366f1" fill-opacity="0.18" stroke="#a5b4fc" stroke-width="2.5"/>
  <text x="610" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#a5b4fc">Sync</text>
  <text x="610" y="210" text-anchor="middle" font-size="13" fill="#c7d2fe">same data on</text>
  <text x="610" y="231" text-anchor="middle" font-size="13" fill="#c7d2fe">every device</text>

  <text x="480" y="194" text-anchor="middle" font-size="15" font-weight="800" fill="url(#mid)">Senkronla</text>
  <text x="480" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">sealed envelope</text>

  <text x="480" y="364" text-anchor="middle" font-size="14" fill="#94a3b8">The less the middle layer knows, the less it can leak on a bad day.</text>
</svg>
