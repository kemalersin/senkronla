      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="390" rx="16" fill="#0f172a"/>
  <text x="480" y="50" text-anchor="middle" font-size="23" font-weight="800" fill="#f8fafc">Birini se&#231;mek zorunda de&#287;ilsiniz</text>

  <!-- left circle: privacy -->
  <circle cx="408" cy="200" r="118" fill="#14b8a6" fill-opacity="0.18" stroke="#5eead4" stroke-width="2.5"/>
  <text x="362" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#5eead4">Gizlilik</text>
  <text x="362" y="210" text-anchor="middle" font-size="13" fill="#99f6e4">veri cihazda</text>
