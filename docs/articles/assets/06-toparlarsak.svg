  <text x="610" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#a5b4fc">Senkron</text>
  <text x="610" y="210" text-anchor="middle" font-size="13" fill="#c7d2fe">her cihazda</text>
  <text x="610" y="231" text-anchor="middle" font-size="13" fill="#c7d2fe">ayn&#305; veri</text>

  <!-- intersection label -->
