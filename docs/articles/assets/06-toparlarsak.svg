  <text x="480" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#e2e8f0">kapal&#305; zarf</text>

  <text x="480" y="364" text-anchor="middle" font-size="14" fill="#94a3b8">Aradaki katman ne kadar az &#351;ey bilirse, o kadar az &#351;ey s&#305;zd&#305;rabilir.</text>
