    <text x="68" y="36" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#1b2330">senkron<tspan fill="#0b7a71">la</tspan></text>
  </g>

  <text x="80" y="172" font-size="15" font-weight="600" letter-spacing="3" fill="#0b7a71">ENVELOPE SYNC RELAY</text>

  <!-- headline (serif) -->
  <text x="78" y="278" font-size="62" font-weight="700" fill="#1b2330" font-family="'Source Serif 4', Georgia, serif">Gizlili&#287;i bozmadan,</text>
  <text x="78" y="352" font-size="62" font-weight="700" fill="#0b7a71" font-family="'Source Serif 4', Georgia, serif">cihazlar aras&#305; senkron</text>

  <!-- lead -->
  <text x="80" y="412" font-size="23" fill="#5a6578">Veri kullan&#305;c&#305;n&#305;n cihaz&#305;nda &#351;ifrelenir.</text>
  <text x="80" y="446" font-size="23" fill="#5a6578">Relay yaln&#305;zca kapal&#305; zarf&#305; ta&#351;&#305;r, i&#231;ine bakmaz.</text>

