    <text x="80" y="168" font-size="15" font-weight="600" letter-spacing="3" fill="#3dd6c6">ENVELOPE SYNC RELAY</text>

    <text x="78" y="252" font-size="50" font-weight="700" fill="#e8edf5" font-family="'Source Serif 4', Georgia, serif">Without compromising</text>
    <text x="78" y="310" font-size="50" font-weight="700" fill="#e8edf5" font-family="'Source Serif 4', Georgia, serif">privacy,</text>
    <text x="78" y="368" font-size="50" font-weight="700" fill="#3dd6c6" font-family="'Source Serif 4', Georgia, serif">sync across devices</text>

    <text x="80" y="420" font-size="21" fill="#8b9cb3">Data is encrypted on device. The relay carries sealed envelopes only,</text>
    <text x="80" y="450" font-size="21" fill="#8b9cb3">never reads inside. Open source, self-hosted.</text>

