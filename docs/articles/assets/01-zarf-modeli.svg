<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="380" rx="16" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Zarf modeli: relay ta&#351;&#305;r, i&#231;ine bakmaz</text>

  <!-- Device A -->
  <g>
    <rect x="40" y="120" width="190" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="70" y="150" width="130" height="78" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="92" y="232" width="86" height="10" rx="5" fill="#cbd5e1"/>
    <text x="135" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">snapshot al</text>
    <text x="135" y="206" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">+ &#351;ifrele</text>
    <text x="135" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Cihaz A</text>
  </g>

  <!-- Envelope 1 -->
  <g>
    <rect x="268" y="168" width="92" height="60" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <path d="M268 174 L314 206 L360 174" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="314" cy="222" r="11" fill="#0f766e"/>
    <rect x="310" y="219" width="8" height="7" rx="1.5" fill="#ccfbf1"/>
    <path d="M311 219 a3 3 0 0 1 6 0" fill="none" stroke="#ccfbf1" stroke-width="1.6"/>
    <text x="314" y="252" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="600">ESR-DOC1</text>
  </g>
  <path d="M236 195 L262 195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Relay -->
  <g>
    <rect x="388" y="110" width="184" height="170" rx="16" fill="#0f172a"/>
    <text x="480" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Senkronla</text>
    <text x="480" y="166" text-anchor="middle" font-size="12" fill="#94a3b8">relay</text>
    <!-- crossed eye -->
    <g transform="translate(480,205)">
      <path d="M-34 0 q34 -28 68 0 q-34 28 -68 0 Z" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#5eead4" stroke-width="2.5"/>
      <line x1="-40" y1="-22" x2="40" y2="22" stroke="#f87171" stroke-width="3.5"/>
    </g>
    <text x="480" y="258" text-anchor="middle" font-size="12" fill="#5eead4" font-weight="600">i&#231;eri&#287;i g&#246;remez</text>
  </g>
  <path d="M366 195 L384 195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M576 195 L596 195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Envelope 2 -->
  <g>
    <rect x="600" y="168" width="92" height="60" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
    <path d="M600 174 L646 206 L692 174" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <circle cx="646" cy="222" r="11" fill="#0f766e"/>
    <rect x="642" y="219" width="8" height="7" rx="1.5" fill="#ccfbf1"/>
    <path d="M643 219 a3 3 0 0 1 6 0" fill="none" stroke="#ccfbf1" stroke-width="1.6"/>
    <text x="646" y="252" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="600">ESR-DOC1</text>
  </g>
  <path d="M698 195 L724 195" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Device B (phone) -->
  <g>
    <rect x="730" y="120" width="190" height="150" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="798" y="142" width="54" height="100" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="825" cy="232" r="3" fill="#94a3b8"/>
    <text x="825" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Cihaz B</text>
    <text x="825" y="178" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">kendi</text>
    <text x="825" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">parolas&#305;yla</text>
    <text x="825" y="210" text-anchor="middle" font-size="11" font-weight="600" fill="#4338ca">a&#231;ar</text>
  </g>

  <text x="480" y="330" text-anchor="middle" font-size="13" fill="#64748b">&#350;ifreleme cihazda, &#231;&#246;zme cihazda. Aradaki katman sadece kapal&#305; zarf&#305; ta&#351;&#305;r.</text>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
