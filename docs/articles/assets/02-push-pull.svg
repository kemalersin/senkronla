<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="440" rx="16" fill="#f8fafc"/>
  <text x="480" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Senkron ak&#305;&#351;&#305;: &#246;nce sor, sonra &#231;ek, &#231;ak&#305;&#351;&#305;rsa kullan&#305;c&#305;ya b&#305;rak</text>

  <!-- lifelines -->
  <rect x="120" y="70" width="170" height="40" rx="10" fill="#4338ca"/>
  <text x="205" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">&#304;stemci</text>
  <line x1="205" y1="110" x2="205" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="670" y="70" width="170" height="40" rx="10" fill="#0f766e"/>
  <text x="755" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Senkronla relay</text>
  <line x1="755" y1="110" x2="755" y2="410" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- step 1 -->
  <text x="210" y="150" font-size="13" font-weight="600" fill="#0f172a">1. "En g&#252;ncel s&#252;r&#252;m ne?"</text>
  <path d="M205 158 L750 158" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="478" y="174" text-anchor="middle" font-size="12" fill="#6366f1">GET head/meta</text>

  <!-- step 2 -->
  <text x="500" y="206" font-size="13" font-weight="600" fill="#0f172a" text-anchor="end">2. De&#287;i&#351;tiyse zarf&#305; indir, kendin a&#231;</text>
  <path d="M205 214 L750 214" stroke="#6366f1" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="478" y="230" text-anchor="middle" font-size="12" fill="#6366f1">GET head</text>

  <!-- step 3 -->
  <text x="210" y="262" font-size="13" font-weight="600" fill="#0f172a">3. Yerel de&#287;i&#351;ikli&#287;i g&#246;nder (expectedRevision)</text>
  <path d="M205 270 L750 270" stroke="#14b8a6" stroke-width="2.5" marker-end="url(#a2t)"/>
  <text x="478" y="286" text-anchor="middle" font-size="12" fill="#0f766e">PUT document</text>

  <!-- step 4 conflict -->
  <rect x="300" y="312" width="360" height="76" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="480" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#be123c">4. Araya biri girdiyse: 409 Conflict</text>
  <text x="480" y="362" text-anchor="middle" font-size="12.5" fill="#9f1239">Sunucu birle&#351;tirmez. Karar&#305; uygulama (yani kullan&#305;c&#305;) verir.</text>
  <path d="M755 300 L660 330" stroke="#fb7185" stroke-width="2.5" marker-end="url(#a2r)"/>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#6366f1"/></marker>
    <marker id="a2t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#14b8a6"/></marker>
    <marker id="a2r" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#fb7185"/></marker>
  </defs>
</svg>
