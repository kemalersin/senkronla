# Senkronla server configuration (doc 07)
# Copy to config.yaml or set ESR_CONFIG_PATH

server:
  host: "0.0.0.0"
  port: 8080
  publicUrl: "http://localhost:8080"
  trustProxy: false

database:
  url: "${ESR_DATABASE_URL}"
  poolSize: 10
  ssl: false

blob:
  driver: "filesystem"
  filesystem:
    path: "./data/blobs"

auth:
  adminApiToken: "${ESR_ADMIN_TOKEN}"
  deviceTokenBytes: 32

recovery:
  argon2:
    memoryCost: 65536
    timeCost: 3
    parallelism: 4

limits:
  defaultFreeDeviceLimit: 2
  onLimitReached:
    mode: payment
    slotPackages: [3, 5, 10]
  rateLimit:
    enabled: true
    recoverPerHour: 5
    pairingPerHour: 20
    pairingTokensPerHour: 30
    pushPerHourPerDevice: 120
    generalPerMinutePerIp: 300
    developerAuthMailPerHourPerIp: 20

pairing:
  codeTtlSeconds: 600
  codeLength: 6
  maxTtlSeconds: 3600

sync:
  maxEnvelopeBytes: 52428800
  maxDocumentsPerNamespace: 32   # 0 = unlimited; multi-document cap per namespace
  allowedDocumentIds: []         # empty = any valid id; e.g. [primary, settings]
  allowedContentTypes: []

unlock:
  codePrefix: "ESR-UNLK"
  defaultExpiryDays: 365
  hmacSecret: "${ESR_UNLOCK_HMAC_SECRET}"

apps:
  enabled: false
  registrationMode: operator_managed
  requireRegistration: true
  allowLocalhostOrigins: false
  legacyDefaultAppId: null
  verification:
    dnsRecordPrefix: "_esr-verify"
    wellKnownPath: "/.well-known/esr-app-verification"
    challengeTtlSeconds: 86400
    fetchTimeoutSeconds: 10
  limits:
    perApp:
      namespacesPerDay: 100
      pairingTokensPerHour: 30
      recoverPerHour: 5
    perDeveloper:
      maxApps: 10
  native:
    requireClientSecret: false
    requireManualReview: true
  developerPortal:
    enabled: false
    jwtSecret: "${ESR_DEVELOPER_JWT_SECRET}"
    sessionTtlHours: 168
    requireEmailVerification: true
    emailVerifyTtlSeconds: 86400
    passwordResetTtlSeconds: 3600
    authMailPerHourPerDeveloper: 5
  seed: []

mail:
  enabled: false
  from: "${ESR_MAIL__FROM}"
  fromName: "Senkronla"
  webBaseUrl: "http://localhost:3000"
  smtp:
    host: "${ESR_SMTP__HOST}"
    port: 587
    secure: false
    user: "${ESR_SMTP__USER}"
    password: "${ESR_SMTP__PASSWORD}"

cors:
  allowedOrigins:
    - "*"

logging:
  level: "info"
  format: "json"
  redactPaths:
    - "envelope.payload"
    - "deviceToken"
    - "recoveryKeyProof"

metrics:
  enabled: true
  path: "/metrics"

websocket:
  enabled: true
  pingIntervalSeconds: 30
  pongTimeoutSeconds: 10
  maxConnectionsPerNamespace: 20
  maxConnectionsPerDevice: 3
