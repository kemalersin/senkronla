# API relay — https://sync.senkron.la
# Upstream: Docker ESR_PUBLISH_PORT=8080
# WebSocket: wss://sync.senkron.la/v1/namespaces/{id}/notifications
#
# Install:
#   sudo cp docker/nginx/sync.senkron.la.conf /etc/nginx/sites-available/sync.senkron.la
#   sudo ln -s /etc/nginx/sites-available/sync.senkron.la /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sync.senkron.la;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.senkron.la;

    ssl_certificate     /etc/letsencrypt/live/senkron.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senkron.la/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SenkronlaApiSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/sync.senkron.la.access.log;
    error_log  /var/log/nginx/sync.senkron.la.error.log;

    # Default ESR_MAX_ENVELOPE_BYTES=52428800 (50 MiB) + headroom
    client_max_body_size 52m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket (esr-notifications-v1)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
