# Web portal — https://senkron.la
# Upstream: Docker WEB_PUBLISH_PORT=3002 (or pnpm dev on 3000)
#
# Install (Debian/Ubuntu):
#   sudo cp docker/nginx/senkron.la.conf /etc/nginx/sites-available/senkron.la
#   sudo ln -s /etc/nginx/sites-available/senkron.la /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Let's Encrypt (certbot) or Cloudflare Origin Certificate on the origin.
# Cloudflare SSL/TLS mode: Full (strict).

server {
    listen 80;
    listen [::]:80;
    server_name senkron.la www.senkron.la;

    # Certbot HTTP-01 (optional if DNS-only validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://senkron.la$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.senkron.la;

    ssl_certificate     /etc/letsencrypt/live/senkron.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senkron.la/privkey.pem;

    return 301 https://senkron.la$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name senkron.la;

    ssl_certificate     /etc/letsencrypt/live/senkron.la/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/senkron.la/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SenkronlaWebSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    access_log /var/log/nginx/senkron.la.access.log;
    error_log  /var/log/nginx/senkron.la.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
