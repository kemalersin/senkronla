# Senkronla — Docker Compose
#
# Configuration: repo-root `.env` (copy from `.env.example`). Always run from the repo root
# with `--project-directory .` so relative paths (e.g. ESR_BLOB_PATH=./data/blobs) match pnpm dev.
#
# 1) Bundled Postgres (default for local dev):
#    docker compose --project-directory . -f docker/docker-compose.yml --env-file .env --profile bundled-db up --build
#
# 2) External Postgres (existing instance — Docker or bare metal):
#    Set ESR_COMPOSE_DATABASE_URL in .env, then:
#    docker compose --project-directory . -f docker/docker-compose.yml --env-file .env up api web
#    (omit --profile bundled-db — postgres service is not started)
#
# External DB on host machine from container:
#   macOS/Windows: ESR_COMPOSE_DATABASE_URL=postgresql://user:pass@host.docker.internal:5432/esr
#   Linux:         postgresql://user:pass@172.17.0.1:5432/esr
#                  or add extra_hosts: host.docker.internal:host-gateway (api service already has this)
#
# Optional per-container CPU/RAM limits (shared host):
#   docker compose --project-directory . -f docker/docker-compose.yml -f docker/docker-compose.resources.example.yml \
#     --env-file .env --profile bundled-db up --build
#
# Blob storage: ESR_BLOB_PATH in .env is the host bind-mount source; inside the api container ESR_BLOB_PATH is /data/blobs.
#
# env_file uses ${PWD}/.env so variables reach containers even when the project directory is docker/.
# Always run compose from the repo root (where .env lives). After .env changes: add --force-recreate.

services:
  postgres:
    profiles: [bundled-db]
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${PWD}/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-esr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-esr}
      POSTGRES_DB: ${POSTGRES_DB:-esr}
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-esr} -d ${POSTGRES_DB:-esr}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ${PWD}/.env
    ports:
      - '${ESR_PUBLISH_PORT:-8080}:8080'
    environment:
      ESR_HOST: 0.0.0.0
      ESR_PORT: 8080
      ESR_PUBLIC_URL: ${ESR_PUBLIC_URL:-http://localhost:8080}
      ESR_DATABASE_URL: ${ESR_COMPOSE_DATABASE_URL:-}
      ESR_DATABASE_HOST: postgres
      ESR_DATABASE_PORT: '5432'
      ESR_DATABASE_USER: ${POSTGRES_USER:-esr}
      ESR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-esr}
      ESR_DATABASE_NAME: ${POSTGRES_DB:-esr}
      ESR_BLOB_PATH: /data/blobs
    volumes:
      - ${ESR_BLOB_PATH:-./data/blobs}:/data/blobs
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ${PWD}/.env
    ports:
      - '${WEB_PUBLISH_PORT:-3000}:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${ESR_PUBLIC_URL:-http://localhost:8080}
      NEXT_PUBLIC_DEFAULT_LOCALE: en
    depends_on:
      - api

volumes:
  postgres_data:
