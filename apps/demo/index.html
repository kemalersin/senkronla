<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senkronla — Interactive SDK Tutorial</title>
    <meta
      name="description"
      content="An interactive, two-column tutorial for the Senkronla client SDK: documents, namespaces, recovery, pairing, conflicts, encryption and notifications."
    />
    <link rel="icon" href="https://senkron.la/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="https://senkron.la/favicon.ico" sizes="any" />
    <script>
      ;(function () {
        try {
          var key = 'senkronla-theme'
          var stored = localStorage.getItem(key)
          var theme = stored === 'dark' || stored === 'light' ? stored : null
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
