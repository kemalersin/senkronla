          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApps'
    post:
      tags: [Applications, Admin]
      summary: Create application (operator_managed)
      description: |
        Operator-managed app registration. Optional `clientSecret` for native confidential clients;
        not assigned automatically — use rotate-secret on the developer path or set explicitly here.
      security:
        - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appId, name, type]
              properties:
                appId:
                  type: string
                  pattern: '^esr_app_[a-z0-9_]+$'
                name:
                  type: string
                type:
                  type: string
                  enum: [web, native]
                status:
                  type: string
                  enum: [pending, pending_verification, active, suspended, archived]
                origins:
                  type: array
                  items:
                    type: string
                    format: uri
                bundleIds:
                  type: object
                  properties:
                    ios:
                      type: string
                    android:
                      type: string
                    desktop:
                      type: string
                clientSecret:
                  type: string
                  minLength: 16
      responses:
        '201':
          description: App created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'

