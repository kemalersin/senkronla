openapi: 3.1.0
info:
  title: Envelope Sync Relay API
  version: 1.3.1
  description: |
    Zero-knowledge document sync relay for offline-first applications.
    Full specification: docs/envelope-sync-relay/README.md

    **v1.3.1:** App list search (`q`) matches app ID, name, and registered bundle ID; `/health`
    exposes `developerPortal.enabled`, `apps.enabled`, `apps.requireRegistration`, and
    `apps.nativeRequireClientSecret`; operator developer accounts API (`/admin/developers`).

    **v1.3:** Application registry — `X-ESR-App-Id`, namespace–app binding, operator admin API,
    developer self-service portal, origin verification, pairing `allowedAppIds`.
    See docs/envelope-sync-relay/en/16-APP-REGISTRY.md

    **v1.2:** Multi-document per namespace (`/documents/{documentId}/...`).

    WebSocket notifications (v1.1): wss://{host}/v1/namespaces/{namespaceId}/notifications
    See 13-WEBSOCKET-NOTIFICATIONS.md — not covered by this OpenAPI file.

servers:
  - url: https://sync.example.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development

tags:
  - name: Namespaces
  - name: Devices
  - name: Documents
  - name: Limits
  - name: Recovery
  - name: Admin
  - name: Applications
  - name: Developer
  - name: Health

components:
  securitySchemes:
    DeviceToken:
      type: http
      scheme: bearer
      bearerFormat: device_token
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: admin_api_token
    DeveloperToken:
      type: http
      scheme: bearer
      bearerFormat: developer_jwt

  parameters:
    AppIdHeader:
      name: X-ESR-App-Id
      in: header
      required: false
      schema:
        type: string
        pattern: '^esr_app_[a-z0-9_]+$'
      description: Public application id — required when apps.enabled and apps.requireRegistration
    OriginHeader:
      name: Origin
      in: header
      required: false
      schema:
        type: string
      description: Browser origin — must match registered origin for web apps
    NativePlatformHeader:
      name: X-ESR-Platform
      in: header
      required: false
      schema:
        type: string
        enum: [ios, android, desktop]
    NativeBundleIdHeader:
      name: X-ESR-Bundle-Id
      in: header
      required: false
      schema:
        type: string
    NativeClientSecretHeader:
      name: X-ESR-Client-Secret
      in: header
      required: false
      schema:
        type: string
      description: Required for confidential native apps when native.requireClientSecret is true
    NamespaceId:
      name: namespaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,62}$'

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    Limits:
      type: object
      properties:
        freeDeviceLimit:
          type: integer
        purchasedSlots:
          type: integer
        maxDevices:
          type: integer
        activeDevices:
          type: integer

    OnLimitReached:
      type: object
      properties:
        mode:
          type: string
          enum: [payment, block]
        slotPackages:
          type: array
          items:
            type: integer

    LimitOverrides:
      type: object
      additionalProperties: false
      properties:
        recoverPerHour:
          type: integer
          minimum: 1
          nullable: true
        pairingPerHour:
          type: integer
          minimum: 1
          nullable: true
        pairingTokensPerHour:
          type: integer
          minimum: 1
          nullable: true
        pushPerHourPerDevice:
          type: integer
          minimum: 1
          nullable: true
        namespacesPerDay:
          type: integer
          minimum: 1
          nullable: true
        freeDeviceLimit:
          type: integer
          minimum: 0
          nullable: true
        purchasedSlots:
          type: integer
          minimum: 0
          nullable: true

    EffectiveLimitsResponse:
      type: object
      required: [effective, sources, overrides, configDefaults]
      properties:
        effective:
          type: object
          additionalProperties:
            type: integer
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [namespace, app, developer, operator, row, env, config]
        overrides:
          type: object
          properties:
            namespace:
              $ref: '#/components/schemas/LimitOverrides'
            app:
              $ref: '#/components/schemas/LimitOverrides'
            developer:
              $ref: '#/components/schemas/LimitOverrides'
            operator:
              $ref: '#/components/schemas/LimitOverrides'
        configDefaults:
          type: object
          additionalProperties:
            type: integer
        envDefaults:
          type: object
          additionalProperties:
            type: integer
        inheritDefaults:
          type: object
          additionalProperties:
            type: integer

    EsrDocEnvelope:
      type: object
      required:
        - magic
        - schemaVersion
        - namespaceId
        - namespaceLabel
        - documentId
        - revision
        - deviceId
        - writtenAt
        - contentType
        - contentMagic
        - contentSha256
        - payload
      properties:
        magic:
          type: string
          const: ESR-DOC1
        schemaVersion:
          type: integer
          enum: [1, 2]
        namespaceId:
          type: string
          format: uuid
        namespaceLabel:
          type: string
        documentId:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,62}$'
          description: schemaVersion 1 requires `primary`; schemaVersion 2 allows any valid id
        revision:
          type: string
        deviceId:
          type: string
        writtenAt:
          type: string
          format: date-time
        contentType:
          type: string
        contentMagic:
          type: string
          enum: [ENV-RAW1, ENV-ENC1]
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        payload:
          type: string

    DocumentHeadMeta:
      type: object
      properties:
        revision:
          type: string
        writtenAt:
          type: string
          format: date-time
        deviceId:
          type: string
        contentSha256:
          type: string
        contentMagic:
          type: string
        sizeBytes:
          type: integer

    Device:
      type: object
      properties:
        deviceId:
          type: string
        clientDeviceId:
          type: string
        label:
          type: string
        pairedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        isCurrent:
          type: boolean

    RateLimitQuota:
      type: object
      required: [action, limit, remaining, resetAfterSeconds, windowSeconds]
      properties:
        action:
          type: string
          enum: [global_ip, put_document, recover, pair_device, pairing_token]
          description: Internal action id; JSON `rateLimits` keys match this value (document PUT uses `put_document`).
        limit:
          type: integer
        remaining:
          type: integer
        resetAfterSeconds:
          type: integer
          description: Seconds until the oldest event in the sliding window expires.
        windowSeconds:
          type: integer

    RateLimits:
      type: object
      description: Optional on success when limits.rateLimit.enabled; keys are action ids.
      additionalProperties:
        $ref: '#/components/schemas/RateLimitQuota'

    PushDocumentResult:
      type: object
      required: [revision, writtenAt, contentSha256, writerDeviceId]
      properties:
        revision:
          type: string
        writtenAt:
          type: string
          format: date-time
        contentSha256:
          type: string
        writerDeviceId:
          type: string
        rateLimits:
          $ref: '#/components/schemas/RateLimits'

    OriginVerification:
      type: object
      properties:
        dnsHost:
          type: string
        dnsTxt:
          type: string
        wellKnownUrl:
          type: string
          format: uri

    AppOrigin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        origin:
          type: string
          format: uri
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        verification:
          $ref: '#/components/schemas/OriginVerification'
          nullable: true

    AppBundle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, android, desktop]
        bundleId:
          type: string
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    AppSummary:
      type: object
      properties:
        appId:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [web, native]
        status:
          type: string
          enum: [pending, pending_verification, active, suspended, archived]
        originCount:
          type: integer
        bundleCount:
          type: integer
        namespaceCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AppDetail:
      allOf:
        - $ref: '#/components/schemas/AppSummary'
        - type: object
          properties:
            origins:
              type: array
              items:
                $ref: '#/components/schemas/AppOrigin'
            bundles:
              type: array
              items:
                $ref: '#/components/schemas/AppBundle'
            hasClientSecret:
              type: boolean

    PaginatedApps:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    DeveloperProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    DeveloperAuthResponse:
      type: object
      properties:
        token:
          type: string
        developer:
          $ref: '#/components/schemas/DeveloperProfile'

    AdminDeveloperSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        disabled:
          type: boolean
        disabledAt:
          type: string
          format: date-time
          nullable: true
        appCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    PaginatedDevelopers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminDeveloperSummary'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        database:
          type: object
          properties:
            status:
              type: string
              enum: [ok, error]
            mode:
              type: string
              enum: [bundled, external]
            message:
              type: string
        blob:
          type: object
          properties:
            status:
              type: string
              enum: [ok, error]
            path:
              type: string
            message:
              type: string
        websocket:
          type: boolean
        developerPortal:
          type: object
          properties:
            enabled:
              type: boolean
          description: True when self-service developer portal is configured
        apps:
          type: object
          properties:
            enabled:
              type: boolean
            requireRegistration:
              type: boolean
            nativeRequireClientSecret:
              type: boolean
          description: App registry flags for client and portal discovery

    PairingTokenResult:
      type: object
      properties:
        code:
          type: string
          pattern: '^\\d{6}$'
        expiresAt:
          type: string
          format: date-time
        qrPayload:
          type: string
        allowedAppIds:
          type: array
          items:
            type: string
        rateLimits:
          $ref: '#/components/schemas/RateLimits'

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Error429:
      description: |
        Rate limit exceeded (`RATE_LIMIT_EXCEEDED`). No top-level `rateLimits` on errors —
        use `error.details.rateLimit` (single quota). Matching `RateLimit-*` or prefixed
        headers (e.g. `RateLimit-PutDocument-*` for `put_document`).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorBody'
              - type: object
                properties:
                  error:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          retryAfterSeconds:
                            type: integer
                          action:
                            type: string
                            enum: [global_ip, put_document, recover, pair_device, pairing_token]
                          rateLimit:
                            $ref: '#/components/schemas/RateLimitQuota'

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      servers:
        - url: http://localhost:8080
          description: Local development (root — not under /v1)
        - url: https://sync.example.com
          description: Production (root)
      description: |
        No authentication. Returns `503` when database or blob storage checks fail (`status: degraded`).
        Use `developerPortal.enabled`, `apps.enabled`, `apps.requireRegistration`, and
        `apps.nativeRequireClientSecret` to configure portal UI and client app headers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Degraded (database or blob check failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /namespaces:
    post:
      tags: [Namespaces]
      summary: Create namespace (first device / host)
      parameters:
        - $ref: '#/components/parameters/AppIdHeader'
        - $ref: '#/components/parameters/OriginHeader'
      description: |
        When `apps.enabled` and `apps.requireRegistration` are true, `X-ESR-App-Id` is required and
        web apps must send a matching `Origin` header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - namespaceId
                - namespaceLabel
                - recoveryKeySalt
                - recoveryKeyHash
                - deviceLabel
                - clientDeviceId
              properties:
                namespaceId:
                  type: string
                  format: uuid
                namespaceLabel:
                  type: string
                recoveryKeySalt:
                  type: string
                recoveryKeyHash:
                  type: string
                deviceLabel:
                  type: string
                clientDeviceId:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  namespaceId:
                    type: string
                  deviceToken:
                    type: string
                  deviceId:
                    type: string
                  limits:
                    $ref: '#/components/schemas/Limits'
        '409':
          $ref: '#/components/responses/Error409'

  /namespaces/{namespaceId}:
    get:
      tags: [Namespaces]
      summary: Get namespace info
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /namespaces/{namespaceId}/devices:
    get:
      tags: [Devices]
      summary: List devices
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  limits:
                    $ref: '#/components/schemas/Limits'
    post:
      tags: [Devices]
      summary: Redeem pairing code (new device)
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AppIdHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/NativePlatformHeader'
        - $ref: '#/components/parameters/NativeBundleIdHeader'
        - $ref: '#/components/parameters/NativeClientSecretHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairingCode, deviceLabel, clientDeviceId]
              properties:
                pairingCode:
                  type: string
                deviceLabel:
                  type: string
                clientDeviceId:
                  type: string
      responses:
        '201':
          description: Paired (may include `rateLimits` with `global_ip` and `pair_device`)
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/devices/{deviceId}:
    delete:
      tags: [Devices]
      summary: Revoke device
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Error403'

  /namespaces/{namespaceId}/pairing-tokens:
    post:
      tags: [Devices]
      summary: Create pairing token
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/AppIdHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/NativePlatformHeader'
        - $ref: '#/components/parameters/NativeBundleIdHeader'
        - $ref: '#/components/parameters/NativeClientSecretHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlSeconds:
                  type: integer
                allowedAppIds:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                    pattern: '^esr_app_[a-z0-9_]+$'
                  description: Optional — restrict pairing redeem to listed active apps
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingTokenResult'
        '403':
          $ref: '#/components/responses/Error403'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/recover:
    post:
      tags: [Recovery]
      summary: Recover namespace access
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recoveryKeyProof, deviceLabel, clientDeviceId]
              properties:
                recoveryKeyProof:
                  type: object
                  properties:
                    salt:
                      type: string
                    hash:
                      type: string
                deviceLabel:
                  type: string
                clientDeviceId:
                  type: string
      responses:
        '200':
          description: Recovered (may include `rateLimits` in body)
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents:
    get:
      tags: [Documents]
      summary: List document heads in namespace
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                type: object
                required: [documents]
                properties:
                  documents:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/DocumentHeadMeta'
                        - type: object
                          required: [documentId]
                          properties:
                            documentId:
                              type: string
                  rateLimits:
                    $ref: '#/components/schemas/RateLimits'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/{documentId}/head/meta:
    get:
      tags: [Documents]
      summary: Get head metadata for a document
      security:
        - DeviceToken: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DocumentHeadMeta'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '400':
          description: Invalid documentId
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/{documentId}/head:
    get:
      tags: [Documents]
      summary: Get full head envelope for a document
      security:
        - DeviceToken: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EsrDocEnvelope'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '400':
          description: Invalid documentId
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/{documentId}:
    put:
      tags: [Documents]
      summary: Push new revision for a document
      security:
        - DeviceToken: []
      parameters:
        - $ref: '#/components/parameters/NamespaceId'
        - $ref: '#/components/parameters/DocumentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                expectedRevision:
                  type: string
                  nullable: true
                envelope:
                  $ref: '#/components/schemas/EsrDocEnvelope'
      responses:
        '201':
          description: Pushed (includes `rateLimits` with `global_ip` and `put_document` when enabled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDocumentResult'
        '403':
          description: Document limit or id not allowed
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          description: Invalid envelope or documentId mismatch
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/primary/head/meta:
    get:
      tags: [Documents]
      summary: Get head metadata only
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/DocumentHeadMeta'
                  - type: object
                    properties:
                      rateLimits:
                        $ref: '#/components/schemas/RateLimits'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'

  /namespaces/{namespaceId}/documents/primary/head:
    get:
      tags: [Documents]
      summary: Get full head envelope
      security:
        - DeviceToken: []
      parameters:
        - name: namespaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (may include `rateLimits` with `global_ip`)
          content:
