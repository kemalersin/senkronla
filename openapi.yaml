              required: [name, type]
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum: [web, native]
      responses:
        '201':
          description: App created (pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'

  /developer/apps/{appId}:
    get:
      tags: [Developer, Applications]
      summary: Get own application detail
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: App detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
    patch:
      tags: [Developer, Applications]
      summary: Update application name
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'
    delete:
      tags: [Developer, Applications]
      summary: Archive own application
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'

  /developer/apps/{appId}/origins:
    post:
      tags: [Developer, Applications]
      summary: Add web origin (verification challenge)
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin:
                  type: string
                  format: uri
      responses:
        '201':
          description: Verification challenge issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'

  /developer/apps/{appId}/origins/{originId}:
    delete:
      tags: [Developer, Applications]
      summary: Remove origin
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: originId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'

  /developer/apps/{appId}/origins/{originId}/verify:
    post:
      tags: [Developer, Applications]
      summary: Run DNS TXT or HTTPS well-known verification
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
        - name: originId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Origin verified; app may become active
        '422':
          description: Verification failed

  /developer/apps/{appId}/bundles:
    post:
      tags: [Developer, Applications]
      summary: Add native bundle
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, bundleId]
              properties:
                platform:
                  type: string
                  enum: [ios, android, desktop]
                bundleId:
                  type: string
      responses:
        '201':
          description: Bundle added (may require operator approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppDetail'

  /developer/apps/{appId}/rotate-secret:
    post:
      tags: [Developer, Applications]
      summary: Generate or rotate native client secret
      description: |
        Returns a new secret once. Requires active app status and approved bundles when
        `apps.native.requireManualReview` is enabled. Replaces any previous secret immediately.
      security:
        - DeveloperToken: []
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New secret (shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                  app:
                    $ref: '#/components/schemas/AppDetail'
