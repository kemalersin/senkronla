urns."}],outputTitle:"Live document"},connect:{eyebrow:"Step 4 — Connect",title:"Connect to a relay",subtitle:"EsrSync.connect wires your adapter, storage and callbacks together.",body:[{kind:"p",text:"Point the SDK at a relay URL. When the relay has the **application registry** enabled (`apps.enabled`), you must also pass an **`appId`** — the demo uses `esr_app_demo`."},{kind:"callout",tone:"info",title:"How are apps registered?",text:"Operators choose a mode: **operator_managed** (YAML seed + admin API) or **self_service**, where app owners register via the developer portal with domain/bundle verification."},{kind:"p",text:"Pass **`persistRecoveryPhrase: true`** on `connect` if the recovery phrase may also be stored in your **StorageAdapter** (for example `localStorage`) after `onRecoveryPhrase` — so `recover()` can run on the same device later. Enable only when that fits your threat model."}],outputTitle:"Connection"},namespace:{eyebrow:"Step 5 — Namespace",title:"Create the namespace",subtitle:"A namespace is one isolated sync space — usually one per account.",body:[{kind:"p",text:"`ensureNamespace()` registers this device, creates the namespace if needed, and performs the first push. The `namespaceId` is a UUID you persist before the first call."},{kind:"p",text:"If a token already exists, the call is a no-op and simply returns `created: false`."}],outputTitle:"Namespace"},recovery:{eyebrow:"Step 6 — Recovery",title:"Show the recovery phrase",subtitle:"The only way back into a workspace from a fresh device.",body:[{kind:"p",text:"When a namespace is first created, `onRecoveryPhrase` fires with a phrase. Because the relay is zero-knowledge, **it cannot recover this for the user** — show it once and ask them to store it offline."},{kind:"p",text:"Optionally pass **`persistRecoveryPhrase: true`** to `EsrSync.connect` to also save the phrase in your **StorageAdapter** (for example `localStorage`) so `recover()` can run on the same device later — only when that fits your security model."}],outputTitle:"Recovery phrase"},sync:{eyebrow:"Step 7 — Sync",title:"Sync manually",subtitle:"Pull the latest head, push pending local changes.",body:[{kind:"p",text:"`sync()` runs a full pull/push cycle. The relay returns **metadata only** for the head — revision, hash and size — never decrypting your payload."}],outputTitle:"Head metadata"},pairing:{eyebrow:"Step 10 — Pairing",title:"Pair another device",subtitle:"Share a short-lived code (or QR) to add a second device.",body:[{kind:"p",text:"`startPairing()` returns a `code`, a `qrPayload` and an expiry. On a second device, open this demo, tap **Join** in the header, paste the `qrPayload` (or enter the namespace ID and code) — it calls `joinPairing(code)` against that namespace."},{kind:"p",text:"Pairing grants device access without ever sharing the recovery phrase."}],outputTitle:"Pairing code"},encryption:{eyebrow:"Step 8 — Encryption",title:"Encrypt the envelope",subtitle:"Opt into end-to-end encryption with a sync password.",body:[{kind:"p",text:"Set `encrypt: true` and provide `resolvePassword`. The SDK builds an **ENV-ENC1** envelope, encrypting the payload before it leaves the device."},{kind:"p",text:"Turn on the toggle, choose a password, then press **Run** to reconnect and push the document with the new setting. The next step syncs further edits with the same adapter."},{kind:"callout",tone:"warn",title:"Zero-knowledge",text:"The relay stores ciphertext it cannot read. Lose the password and the data is unrecoverable — by design."}],outputTitle:"Encrypted vs plaintext"},syncData:{eyebrow:"Step 9 — Envelope",title:"Sync real data",subtitle:"See the exact ESR-DOC1 envelope that leaves the device.",body:[{kind:"p",text:"After every local edit call **`notifyLocalChange()`** — the SDK debounces and pushes on its own. **`sync()` is optional** (step 7); here the button also runs it so you can inspect the envelope immediately."},{kind:"p",text:"Add a note and sync. The panel shows the **ESR-DOC1** envelope the relay receives — metadata plus an opaque `payload`."},{kind:"p",text:"If you enabled encryption in the previous step, the payload is an **ENV-ENC1** blob; otherwise it is **ENV-RAW1**. The relay never interprets either."}],outputTitle:"ESR-DOC1 envelope"},conflict:{eyebrow:"Step 11 — Conflict",title:"Resolve a conflict",subtitle:"Two devices, one head — your app decides the winner.",body:[{kind:"p",text:"When local and remote revisions diverge, `onConflict` is called with both revisions and the remote metadata. Return **`local`**, **`remote`** or **`cancel`**."},{kind:"p",text:"Press the button to simulate a remote write that conflicts with a local edit."}],outputTitle:"Conflict resolution"},notifications:{eyebrow:"Step 12 — Notifications",title:"Enable live notifications",subtitle:"Push-to-pull updates over WebSocket, with a poll fallback.",body:[{kind:"p",text:"Set `notificationsEnabled: true`. When another device writes, the relay sends a metadata-only **`head_changed`** event and the SDK pulls automatically."},{kind:"p",text:"Open a second tab and edit there — new revisions appear in the log below."}],outputTitle:"Live channel"}},PE={intro:{eyebrow:"Hoş geldin",title:"12 adımda her uygulamayı senkronla",subtitle:"Senkronla istemci SDK’sının, gerçek bir relay üzerinde çalışan rehberli turu.",body:[{kind:"p",text:"Senkronla, **sıfır-bilgi (zero-knowledge)** bir Zarf Senkron Relay’idir (ESR). Veriyi uygulaman şifreler ve sahiplenir; relay yalnızca opak zarfları saklar, revizyonları, cihazları ve bildirimleri koordine eder."},{kind:"p",text:"Sağda küçük, paylaşımlı bir çalışma alanı kuracaksın. Bu sayfayı **iki sekmede** aç (veya bir telefon eşle) ve değişikliklerin canlı aktığını izle."}],outputTitle:"Ne inşa edeceğiz"},install:{eyebrow:"2. Adım — Kurulum",title:"SDK’yı projene ekle",subtitle:"Tek paket; facade, taşıma katmanı ve kripto yardımcılarını verir.",body:[{kind:"p",text:"**@senkronla/client** paketini kur. Zarf/kripto/kimlik içeren **@senkronla/protocol** otomatik olarak gelir."},{kind:"p",text:"Modern tarayıcılarda ve Node 22+’da; `fetch`, `localStorage` ve `WebSocket` varsa onları kullanarak çalışır."}],outputTitle:"Paket"},document:{eyebrow:"3. Adım — Döküman",title:"Dökümanını tanımla",subtitle:"DocumentAdapter, uygulama durumunla senkron motoru arasındaki köprüdür.",body:[{kind:"p",text:"Senkronla **adlandırılmış JSON anlık görüntülerini** senkronlar. Sen `exportDocument` / `importDocument` ve bir `contentType` verirsin; serileştirme ve revizyonları SDK halleder."},{kind:"p",text:"Sağdaki çalışma alanını düzenle ve JSON dökümanının şekillenişini izle — `exportDocument()` tam olarak bunu döndürür."}],outputTitle:"Canlı döküman"},connect:{eyebrow:"4. Adım — Bağlantı",title:"Bir relay’e bağlan",subtitle:"EsrSync.connect; adapter, depolama ve geri çağrıları birbirine bağlar.",body:[{kind:"p",text:"SDK’yı bir relay URL’sine yönlendir. Relay’de **uygulama kaydı** açıksa (`apps.enabled`), ayrıca bir **`appId`** geçmen gerekir — demo `esr_app_demo` kullanır."},{kind:"callout",tone:"info",title:"Uygulamalar nasıl kaydedilir?",text:"Operatör bir mod seçer: **operator_managed** (YAML tohum + admin API) ya da **self_service** — uygulama sahipleri geliştirici portalından alan/bundle doğrulamasıyla kaydolur."},{kind:"p",text:"Kurtarma ifadesinin `onRecoveryPhrase` sonrasında **StorageAdapter**’ında da (ör. `localStorage`) saklanmasına izin veriyorsan `connect`’e **`persistRecoveryPhrase: true`** ekle — aynı cihazda sonra `recover()` için. Yalnızca tehdit modelin buna uygunsa aç."}],outputTitle:"Bağlantı"},namespace:{eyebrow:"5. Adım — Namespace",title:"Namespace’i oluştur",subtitle:"Namespace, izole tek bir senkron alanıdır — genelde hesap başına bir tane.",body:[{kind:"p",text:"`ensureNamespace()` bu cihazı kaydeder, gerekiyorsa namespace’i oluşturur ve ilk push’u yapar. `namespaceId`, ilk çağrıdan önce sakladığın bir UUID’dir."},{kind:"p",text:"Zaten bir token varsa çağrı işlem yapmaz ve yalnızca `created: false` döner."}],outputTitle:"Namespace"},recovery:{eyebrow:"6. Adım — Kurtarma",title:"Kurtarma ifadesini göster",subtitle:"Yeni bir cihazdan çalışma alanına dönmenin tek yolu.",body:[{kind:"p",text:"Namespace ilk oluşturulduğunda `onRecoveryPhrase` bir ifadeyle tetiklenir. Relay sıfır-bilgi olduğundan **bunu kullanıcı adına kurtaramaz** — bir kez göster ve çevrimdışı saklamasını iste."},{kind:"p",text:"İsteğe bağlı olarak `EsrSync.connect`’e **`persistRecoveryPhrase: true`** vererek ifadeyi **StorageAdapter**’ında (ör. `localStorage`) saklayabilirsin; aynı cihazda sonra `recover()` çalıştırmak için — yalnızca tehdit modelin buna uygunsa."}],outputTitle:"Kurtarma ifadesi"},sync:{eyebrow:"7. Adım — Senkron",title:"Elle senkronla",subtitle:"En güncel head’i çek, bekleyen yerel değişiklikleri gönder.",body:[{kind:"p",text:"`sync()` tam bir çek/gönder döngüsü çalıştırır. Relay, head için **yalnızca meta veri** döndürür — revizyon, özet ve boyut — payload’u asla çözmez."}],outputTitle:"Head meta verisi"},pairing:{eyebrow:"10. Adım — Eşleştirme",title:"Başka bir cihaz eşle",subtitle:"İkinci cihazı eklemek için kısa ömürlü bir kod (veya QR) paylaş.",body:[{kind:"p",text:"`startPairing()`; bir `code`, bir `qrPayload` ve son kullanma döndürür. İkinci cihazda bu demoyu aç, başlıktaki **Katıl**’a dokun, `qrPayload`’u yapıştır (veya namespace ID ile kodu gir) — o namespace’e karşı `joinPairing(code)` çağrılır."},{kind:"p",text:"Eşleştirme, kurtarma ifadesi hiç paylaşılmadan cihaz erişimi verir."}],outputTitle:"Eşleştirme kodu"},encryption:{eyebrow:"8. Adım — Şifreleme",title:"Zarfı şifrele",subtitle:"Bir senkron parolasıyla uçtan uca şifrelemeyi aç.",body:[{kind:"p",text:"`encrypt: true` ayarla ve `resolvePassword` ver. SDK bir **ENV-ENC1** zarfı kurar; payload’u cihazdan çıkmadan önce şifreler."},{kind:"p",text:"Toggle’ı aç, parolayı seç, ardından **Çalıştır** ile yeniden bağlanıp belgeyi yeni ayarla relay’e gönder. Sonraki adım aynı adapter ile düzenlemeleri senkronla
